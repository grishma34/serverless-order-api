name: Deploy

# REQ-0023: merging to main reaches production with no manual step, and with no
# long-lived AWS keys — credentials are minted per run by OIDC.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # Required to mint the OIDC token. `contents: read` is all the repo access the
  # deploy needs; nothing here writes back to the repository.
  id-token: write
  contents: read

concurrency:
  # Serialise deploys. cancel-in-progress is deliberately false: interrupting a
  # CloudFormation update mid-flight leaves the stack in UPDATE_IN_PROGRESS and
  # needs manual recovery.
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
  STACK_NAME: serverless-order-api-prod

jobs:
  test:
    # The same gate CI runs, re-run here so a deploy can never outrun it — a
    # merge queue or an admin override could otherwise land untested code.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Tests
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=90

  deploy:
    needs: test
    # Skip cleanly until the account is bootstrapped. Without this the job fails
    # at role assumption on every push, which reads as a broken pipeline rather
    # than an unconfigured one. Set AWS_DEPLOY_ROLE_ARN (docs/DEPLOYMENT.md § 2)
    # and deploys begin on the next merge to main, with no change to this file.
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    # Attach a GitHub environment so required reviewers or a deployment log can
    # be added later without touching this file.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Assume deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # An ARN is not a secret, so this is a repository variable. Nothing in
          # this workflow reads an access key or a secret key.
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build
        run: sam build

      - name: Deploy stack
        run: |
          sam deploy \
            --config-env prod \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Read stack outputs
        id: outputs
        run: |
          get_output() {
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text
          }
          {
            echo "bucket=$(get_output FrontendBucketName)"
            echo "distribution=$(get_output DistributionId)"
            echo "site=$(get_output SiteUrl)"
          } >> "$GITHUB_OUTPUT"

      - name: Publish frontend
        # No existence guard: frontend/ is part of the deliverable, so a missing
        # directory is a broken checkout and should fail loudly rather than
        # quietly deploy an API with no UI in front of it.
        run: |
          # --delete so a file removed from the repo disappears from the site.
          aws s3 sync frontend/ "s3://${{ steps.outputs.outputs.bucket }}/" \
            --delete \
            --region "$AWS_REGION"

      - name: Invalidate CloudFront cache
        # Without this the edge keeps serving the previous index.html for as
        # long as the cache policy allows, so a green deploy looks like a no-op.
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.outputs.outputs.distribution }}" \
            --paths '/*'

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "- Stack: \`$STACK_NAME\`"
            echo "- Site: ${{ steps.outputs.outputs.site }}"
            echo "- Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
