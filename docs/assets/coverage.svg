<svg xmlns="http://www.w3.org/2000/svg" width="119" height="20"
     role="img" aria-label="coverage: 100%">
  <title>coverage: 100%</title>
  <linearGradient id="smooth" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="round"><rect width="119" height="20" rx="3" fill="#fff"/></clipPath>
  <g clip-path="url(#round)">
    <rect width="73" height="20" fill="#555"/>
    <rect x="73" width="46" height="20" fill="#4c1"/>
    <rect width="119" height="20" fill="url(#smooth)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-size="110"
     font-family="Verdana,Geneva,DejaVu Sans,sans-serif">
    <text x="365" y="150" fill="#010101" fill-opacity=".3"
          transform="scale(.1)">coverage</text>
    <text x="365" y="140" transform="scale(.1)">coverage</text>
    <text x="960.0" y="150" fill="#010101" fill-opacity=".3"
          transform="scale(.1)">100%</text>
    <text x="960.0" y="140" transform="scale(.1)">100%</text>
  </g>
</svg>
